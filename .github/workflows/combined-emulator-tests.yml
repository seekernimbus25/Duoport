name: Combined Studio Duoport emulator acceptance
on:
  push:
    branches: ["work/unified-studio-duoport-apk"]
    paths: ["app/**", "studio-contracts/**", "scripts/emulator/combined_tests.py", ".github/workflows/combined-emulator-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combined-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build emulator debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Studio-Duoport acceptance tests on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NEW_APK: ${{ github.workspace }}/app/build/outputs/apk/debug/app-debug.apk
          OUT_DIR: ${{ github.workspace }}/scripts/emulator/combined_out
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated
          script: python3 -u scripts/emulator/combined_tests.py
      - name: Upload reports screenshots and crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-duoport-combined-emulator-results
          path: scripts/emulator/combined_out
          retention-days: 14
          if-no-files-found: warn
