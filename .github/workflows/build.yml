name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DualFrame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DualFrame-apk
          path: DualFrame.apk

      # Every build on main becomes a GitHub Release, so the newest APK is
      # always one tap away under Releases on the repo page.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" DualFrame.apk \
            --title "DualFrame 1.0.${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download DualFrame.apk below and open it on your phone to install." \
            --latest
