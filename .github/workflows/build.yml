name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Sentry client configuration is supplied
        env:
          STUDIO_SENTRY_DSN: ${{ secrets.STUDIO_SENTRY_DSN }}
        run: |
          if [ -z "$STUDIO_SENTRY_DSN" ]; then
            echo "::warning::STUDIO_SENTRY_DSN is absent. This APK will build, but crash reporting will remain disabled."
          else
            echo "::notice::Sentry DSN supplied for Android release build (value not logged)."
          fi

      - name: Build release APK
        env:
          STUDIO_SENTRY_DSN: ${{ secrets.STUDIO_SENTRY_DSN }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FilmmakingStudio-Duoport.apk

      # One package, ONE launcher: Studio. Duoport's native camera is internal.
      - name: Verify combined launcher and package
        run: |
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging FilmmakingStudio-Duoport.apk > /tmp/studio-badging.txt
          grep -F "package: name='com.dualframe.camera'" /tmp/studio-badging.txt
          grep -F "launchable-activity: name='app.filmmaking.studio.MainActivity'" /tmp/studio-badging.txt

      # Google Play needs native libraries aligned for 16 KB memory pages (0x4000 or more).
      - name: Report native library page alignment
        run: |
          rm -rf /tmp/apk && mkdir -p /tmp/apk
          unzip -q -o FilmmakingStudio-Duoport.apk 'lib/arm64-v8a/*' -d /tmp/apk || true
          for so in /tmp/apk/lib/arm64-v8a/*.so; do
            [ -f "$so" ] || continue
            echo "$(basename "$so"): $(readelf -lW "$so" | awk '/LOAD/ {print $NF; exit}')"
          done

      # Google Play requires native libraries built for 16 KB memory pages (Android 15+
      # devices). Fail the build if any 64-bit library in the APK isn't.
      - name: Check 16 KB page alignment
        run: |
          python3 - <<'PY'
          import struct, sys, zipfile
          bad = []
          for i in zipfile.ZipFile("FilmmakingStudio-Duoport.apk").infolist():
              if not (i.filename.endswith(".so") and ("arm64" in i.filename or "x86_64" in i.filename)):
                  continue
              d = zipfile.ZipFile("FilmmakingStudio-Duoport.apk").read(i)
              phoff = struct.unpack_from("<Q", d, 0x20)[0]
              size, count = struct.unpack_from("<HH", d, 0x36)
              aligns = [struct.unpack_from("<Q", d, phoff + k * size + 0x30)[0]
                        for k in range(count) if struct.unpack_from("<I", d, phoff + k * size)[0] == 1]
              print(f"{min(aligns):6d}  {i.filename}")
              if min(aligns) < 16384:
                  bad.append(i.filename)
          if bad:
              sys.exit("Not 16 KB aligned: " + ", ".join(bad))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Duoport-apk
          path: FilmmakingStudio-Duoport.apk

      # Google Play bundle, signed with the private upload key from repository secrets.
      # Skipped until the secrets exist (see docs/PLAY_STORE.md).
      - name: Build Play bundle
        id: play
        env:
          STUDIO_SENTRY_DSN: ${{ secrets.STUDIO_SENTRY_DSN }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "No upload key in secrets yet; skipping the Play bundle."
            exit 0
          fi
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$UPLOAD_KEYSTORE_FILE"
          ./gradlew bundlePlay --stacktrace
          cp app/build/outputs/bundle/play/app-play.aab DualFrame.aab
          rm -f "$UPLOAD_KEYSTORE_FILE"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.play.outputs.built == 'true'
        with:
          name: DualFrame-play-bundle
          path: DualFrame.aab

      # Every build on main becomes a GitHub Release, so the newest APK is
      # always one tap away under Releases on the repo page.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" FilmmakingStudio-Duoport.apk \
            --title "DualFrame 1.0.${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download FilmmakingStudio-Duoport.apk below and open it on your phone to install." \
            --latest
          # The Play bundle goes up to the Play Console by hand (or later by a Play API step).
          if [ -f DualFrame.aab ]; then gh release upload "build-${{ github.run_number }}" DualFrame.aab; fi
