name: Emulator tests

# Runs the automated part of docs/TEST_PLAN.md on an Android emulator. Starts when a commit
# message contains [emu] (optionally [emu only=ID,ID]) or by hand. Results are posted as a
# pre-release named emu-tests-N (not an app build).
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      only:
        description: "Test IDs to run, comma separated (empty = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: emulator-tests
  cancel-in-progress: true

jobs:
  emulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emu')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Which tests
        id: which
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT: ${{ github.event.inputs.only }}
        run: |
          ONLY="$INPUT"
          if [ -z "$ONLY" ]; then ONLY=$(echo "$MSG" | sed -n 's/.*\[emu only=\([^]]*\)\].*/\1/p' | head -1); fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "Running: ${ONLY:-all}"

      # Debuggable build (turns on the test hooks), with a version above every release so it
      # installs over the latest one for the upgrade test.
      - name: Build test APK
        run: GITHUB_RUN_NUMBER=$((100000 + ${{ github.run_number }})) ./gradlew assembleDebug --stacktrace

      - name: Tools and test media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip3 install --quiet pillow || true
          bash scripts/emulator/make_media.sh scripts/emulator/media
          gh release download --repo "$GITHUB_REPOSITORY" --pattern DualFrame.apk --output old.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk new.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NEW_APK: ${{ github.workspace }}/new.apk
          OLD_APK: ${{ github.workspace }}/old.apk
          ONLY: ${{ steps.which.outputs.only }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/emulator/ci_run.sh

      - name: Post results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd scripts/emulator
          [ -d out ] || mkdir out
          cp out/REPORT.md REPORT.md 2>/dev/null || echo "# No report (the run stopped early)" > REPORT.md
          zip -qr results.zip out
          TAG="emu-tests-${{ github.run_number }}"
          # Keep only the newest few result posts.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep '^emu-tests-' | tail -n +4 | \
            while read old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
          gh release create "$TAG" results.zip REPORT.md --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Emulator test results ${{ github.run_number }} (not an app build)" \
            --notes "Automated emulator test results for ${GITHUB_SHA::7}. Download results.zip for screenshots and logs."
          head -c 60000 REPORT.md
